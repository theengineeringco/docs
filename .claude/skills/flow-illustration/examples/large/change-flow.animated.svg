<svg xmlns="http://www.w3.org/2000/svg" width="904" height="236" viewBox="0 0 904 236" fill="none" role="img" class="fi131jf"><title>One spec changes. The agents handle the rest.</title><desc>Four steps: a supplier spec lands, the graph flags what it touches, an agent works the change on a branch, an engineer reviews and merges.</desc><style>.fi131jf-p,.fi131jf-f,.fi131jf-r{transform-box:fill-box;transform-origin:center;animation-fill-mode:both}
