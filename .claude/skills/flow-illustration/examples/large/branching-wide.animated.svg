<svg xmlns="http://www.w3.org/2000/svg" width="760" height="280" viewBox="0 0 760 280" fill="none" role="img" class="fi11rdz"><title>Run workstreams in parallel</title><desc>Branches fork off the live baseline, merge back through review, and leave a baseline at every merge; a what-if stays open on the side.</desc><style>.fi11rdz-p,.fi11rdz-f,.fi11rdz-r{transform-box:fill-box;transform-origin:center;animation-fill-mode:both}
.fi11rdz-p{animation-name:fi11rdz-pop;animation-duration:0.6s;animation-timing-function:cubic-bezier(.34,1.56,.64,1)}
@supports (animation-timing-function:linear(0,1)){.fi11rdz-p{animation-timing-function:linear(0, 0.083, 0.269, 0.487, 0.691, 0.855, 0.972, 1.043, 1.078, 1.086, 1.078, 1.061, 1.043, 1.025, 1.011, 1.002, 0.996, 0.993, 0.993, 0.993, 0.995, 0.996, 0.998, 0.999, 1)}}
.fi11rdz-f{animation-name:fi11rdz-fade;animation-duration:0.5s;animation-timing-function:ease-out}
.fi11rdz-r{animation-name:fi11rdz-rise;animation-duration:.7s;animation-timing-function:cubic-bezier(0.22,1,0.36,1)}
.fi11rdz-d{animation-name:fi11rdz-draw;animation-timing-function:cubic-bezier(0.65,0,0.35,1);animation-fill-mode:both}
.fi11rdz-m{animation:fi11rdz-march 2.6s linear infinite}
.fi11rdz-pulse{animation:fi11rdz-pulse 2.4s ease-in-out infinite}
@keyframes fi11rdz-pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fi11rdz-fade{from{opacity:0}to{opacity:1}}
@keyframes fi11rdz-rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fi11rdz-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fi11rdz-march{from{stroke-dashoffset:0}to{stroke-dashoffset:-18}}
@keyframes fi11rdz-pulse{0%,100%{opacity:1}50%{opacity:.35}}
