<svg xmlns="http://www.w3.org/2000/svg" width="904" height="236" viewBox="0 0 904 236" fill="none" role="img" class="fi1a5pc"><title>How reviews work</title><desc>Claim: nothing reaches the baseline until checks pass and every required reviewer approves. Four steps: a change request opens on a branch, required reviewers are assigned, checks run and reviewers approve, the branch merges and a baseline is recorded.</desc><style>.fi1a5pc-p,.fi1a5pc-f,.fi1a5pc-r{transform-box:fill-box;transform-origin:center;animation-fill-mode:both}
.fi1a5pc-p{animation-name:fi1a5pc-pop;animation-duration:0.6s;animation-timing-function:cubic-bezier(.34,1.56,.64,1)}
@supports (animation-timing-function:linear(0,1)){.fi1a5pc-p{animation-timing-function:linear(0, 0.083, 0.269, 0.487, 0.691, 0.855, 0.972, 1.043, 1.078, 1.086, 1.078, 1.061, 1.043, 1.025, 1.011, 1.002, 0.996, 0.993, 0.993, 0.993, 0.995, 0.996, 0.998, 0.999, 1)}}
.fi1a5pc-f{animation-name:fi1a5pc-fade;animation-duration:0.5s;animation-timing-function:ease-out}
.fi1a5pc-r{animation-name:fi1a5pc-rise;animation-duration:.7s;animation-timing-function:cubic-bezier(0.22,1,0.36,1)}
.fi1a5pc-d{animation-name:fi1a5pc-draw;animation-timing-function:cubic-bezier(0.65,0,0.35,1);animation-fill-mode:both}
.fi1a5pc-m{animation:fi1a5pc-march 2.6s linear infinite}
.fi1a5pc-pulse{animation:fi1a5pc-pulse 2.4s ease-in-out infinite}
@keyframes fi1a5pc-pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fi1a5pc-fade{from{opacity:0}to{opacity:1}}
@keyframes fi1a5pc-rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fi1a5pc-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fi1a5pc-march{from{stroke-dashoffset:0}to{stroke-dashoffset:-18}}
@keyframes fi1a5pc-pulse{0%,100%{opacity:1}50%{opacity:.35}}
