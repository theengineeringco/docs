<svg xmlns="http://www.w3.org/2000/svg" width="240" height="200" viewBox="0 0 240 200" fill="none" role="img" class="fi1onwx"><title>Cross-links</title><desc>Two hierarchies, linked across: peers stay connected wherever they sit in the tree.</desc><style>.fi1onwx-p,.fi1onwx-f,.fi1onwx-r{transform-box:fill-box;transform-origin:center;animation-fill-mode:both}
