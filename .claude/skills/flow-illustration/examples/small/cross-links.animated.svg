@keyframes fi1onwx-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fi1onwx-march{from{stroke-dashoffset:0}to{stroke-dashoffset:-18}}
@keyframes fi1onwx-pulse{0%,100%{opacity:1}50%{opacity:.35}}
