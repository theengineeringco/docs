<svg xmlns="http://www.w3.org/2000/svg" width="240" height="200" viewBox="0 0 240 200" fill="none" role="img" class="filtzb4"><title>Traced to the source</title><desc>Each requirement keeps a live link to the document it came from.</desc><style>.filtzb4-p,.filtzb4-f,.filtzb4-r{transform-box:fill-box;transform-origin:center;animation-fill-mode:both}
.filtzb4-p{animation-name:filtzb4-pop;animation-duration:0.6s;animation-timing-function:cubic-bezier(.34,1.56,.64,1)}
@supports (animation-timing-function:linear(0,1)){.filtzb4-p{animation-timing-function:linear(0, 0.083, 0.269, 0.487, 0.691, 0.855, 0.972, 1.043, 1.078, 1.086, 1.078, 1.061, 1.043, 1.025, 1.011, 1.002, 0.996, 0.993, 0.993, 0.993, 0.995, 0.996, 0.998, 0.999, 1)}}
.filtzb4-f{animation-name:filtzb4-fade;animation-duration:0.5s;animation-timing-function:ease-out}
.filtzb4-r{animation-name:filtzb4-rise;animation-duration:.7s;animation-timing-function:cubic-bezier(0.22,1,0.36,1)}
.filtzb4-d{animation-name:filtzb4-draw;animation-timing-function:cubic-bezier(0.65,0,0.35,1);animation-fill-mode:both}
.filtzb4-m{animation:filtzb4-march 2.6s linear infinite}
.filtzb4-pulse{animation:filtzb4-pulse 2.4s ease-in-out infinite}
@keyframes filtzb4-pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes filtzb4-fade{from{opacity:0}to{opacity:1}}
@keyframes filtzb4-rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes filtzb4-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes filtzb4-march{from{stroke-dashoffset:0}to{stroke-dashoffset:-18}}
@keyframes filtzb4-pulse{0%,100%{opacity:1}50%{opacity:.35}}
