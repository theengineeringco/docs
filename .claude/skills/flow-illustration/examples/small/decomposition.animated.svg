.fi1okil-r{animation-name:fi1okil-rise;animation-duration:.7s;animation-timing-function:cubic-bezier(0.22,1,0.36,1)}
.fi1okil-d{animation-name:fi1okil-draw;animation-timing-function:cubic-bezier(0.65,0,0.35,1);animation-fill-mode:both}
.fi1okil-m{animation:fi1okil-march 2.6s linear infinite}
.fi1okil-pulse{animation:fi1okil-pulse 2.4s ease-in-out infinite}
@keyframes fi1okil-pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fi1okil-fade{from{opacity:0}to{opacity:1}}
@keyframes fi1okil-rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fi1okil-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fi1okil-march{from{stroke-dashoffset:0}to{stroke-dashoffset:-18}}
@keyframes fi1okil-pulse{0%,100%{opacity:1}50%{opacity:.35}}
