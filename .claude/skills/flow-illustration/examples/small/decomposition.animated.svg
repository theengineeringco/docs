<svg xmlns="http://www.w3.org/2000/svg" width="240" height="200" viewBox="0 0 240 200" fill="none" role="img" class="fi1okil"><title>Structured decomposition</title><desc>Top-level intent breaks down into subsystem and component requirements.</desc><style>.fi1okil-p,.fi1okil-f,.fi1okil-r{transform-box:fill-box;transform-origin:center;animation-fill-mode:both}
