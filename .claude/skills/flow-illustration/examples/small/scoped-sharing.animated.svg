<svg xmlns="http://www.w3.org/2000/svg" width="240" height="200" viewBox="0 0 240 200" fill="none" role="img" class="fi1uybg"><title>Scoped to what you share</title><desc>Suppliers see the part of the program you share with them, live, and nothing else.</desc><style>.fi1uybg-p,.fi1uybg-f,.fi1uybg-r{transform-box:fill-box;transform-origin:center;animation-fill-mode:both}
