@keyframes fi1uybg-pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fi1uybg-fade{from{opacity:0}to{opacity:1}}
@keyframes fi1uybg-rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fi1uybg-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fi1uybg-march{from{stroke-dashoffset:0}to{stroke-dashoffset:-18}}
@keyframes fi1uybg-pulse{0%,100%{opacity:1}50%{opacity:.35}}
