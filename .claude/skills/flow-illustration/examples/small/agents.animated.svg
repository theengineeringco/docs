<g><animateMotion path="M146.05 121.85A34 34 0 1 1 93.95 78.15A34 34 0 1 1 146.05 121.85" dur="40s" begin="0s" repeatCount="indefinite"/><g transform="translate(-146.05 -121.85)"><g class="fi185ir-p" style="animation-delay:0.3s"><circle cx="146.05" cy="121.85" r="5" fill="#FFFFFF" stroke="#C9C8C4" stroke-width="1"/></g></g></g>
<g><animateMotion path="M88.05 111.63A34 34 0 1 1 151.95 88.37A34 34 0 1 1 88.05 111.63" dur="40s" begin="0s" repeatCount="indefinite"/><g transform="translate(-88.05 -111.63)"><g class="fi185ir-p" style="animation-delay:0.35s"><circle cx="88.05" cy="111.63" r="5" fill="#FFFFFF" stroke="#C9C8C4" stroke-width="1"/></g></g></g>
