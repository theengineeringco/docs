<g><animateMotion path="M162.43 57.57A60 60 0 1 0 77.57 142.43A60 60 0 1 0 162.43 57.57" dur="64s" begin="0s" repeatCount="indefinite"/><g transform="translate(-162.43 -57.57)"><g class="fi185ir-p" style="animation-delay:0.35s"><rect x="157.93" y="53.07" width="9" height="9" fill="#1F3ACB"/></g></g></g>
<g><animateMotion path="M140.52 156.38A60 60 0 1 0 99.48 43.62A60 60 0 1 0 140.52 156.38" dur="64s" begin="0s" repeatCount="indefinite"/><g transform="translate(-140.52 -156.38)"><g class="fi185ir-p" style="animation-delay:0.4s"><rect x="136.02" y="151.88" width="9" height="9" fill="#1F3ACB"/></g></g></g>
