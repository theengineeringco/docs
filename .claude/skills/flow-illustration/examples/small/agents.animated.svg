<svg xmlns="http://www.w3.org/2000/svg" width="240" height="200" viewBox="0 0 240 200" fill="none" role="img" class="fi185ir"><title>A fleet of agents</title><desc>Agents orbit the live graph, working the whole program at once.</desc><style>.fi185ir-p,.fi185ir-f,.fi185ir-r{transform-box:fill-box;transform-origin:center;animation-fill-mode:both}
.fi185ir-p{animation-name:fi185ir-pop;animation-duration:0.6s;animation-timing-function:cubic-bezier(.34,1.56,.64,1)}
@supports (animation-timing-function:linear(0,1)){.fi185ir-p{animation-timing-function:linear(0, 0.083, 0.269, 0.487, 0.691, 0.855, 0.972, 1.043, 1.078, 1.086, 1.078, 1.061, 1.043, 1.025, 1.011, 1.002, 0.996, 0.993, 0.993, 0.993, 0.995, 0.996, 0.998, 0.999, 1)}}
.fi185ir-f{animation-name:fi185ir-fade;animation-duration:0.5s;animation-timing-function:ease-out}
.fi185ir-r{animation-name:fi185ir-rise;animation-duration:.7s;animation-timing-function:cubic-bezier(0.22,1,0.36,1)}
.fi185ir-d{animation-name:fi185ir-draw;animation-timing-function:cubic-bezier(0.65,0,0.35,1);animation-fill-mode:both}
.fi185ir-m{animation:fi185ir-march 2.6s linear infinite}
.fi185ir-pulse{animation:fi185ir-pulse 2.4s ease-in-out infinite}
@keyframes fi185ir-pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fi185ir-fade{from{opacity:0}to{opacity:1}}
@keyframes fi185ir-rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fi185ir-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fi185ir-march{from{stroke-dashoffset:0}to{stroke-dashoffset:-18}}
@keyframes fi185ir-pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.fi185ir *{animation:none!important}.fi185ir .fi185ir-d{stroke-dashoffset:0}.fi185ir .fi185ir-t{display:none}}</style><g class="fi185ir-p" style="animation-delay:0.05s"><circle cx="120" cy="100" r="34" fill="none" stroke="#C9C8C4" stroke-width="1" stroke-dasharray="4 5" class="fi185ir-m"/></g>
<g class="fi185ir-p" style="animation-delay:0.1s"><circle cx="120" cy="100" r="60" fill="none" stroke="#C9C8C4" stroke-width="1" stroke-dasharray="4 5" class="fi185ir-m"/></g>
