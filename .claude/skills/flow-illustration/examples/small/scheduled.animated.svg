<g class="fi10dhs-p" style="animation-delay:0.75s"><circle cx="168.5" cy="72" r="2.5" fill="#8A8985"/></g>
<g class="fi10dhs-p" style="animation-delay:0.15s"><circle cx="120" cy="100" r="12" fill="#FFFFFF" stroke="#1F3ACB" stroke-width="1"/><rect x="116" y="96" width="8" height="8" fill="#1F3ACB"/></g>
<g><animateMotion path="M120 44A56 56 0 1 1 120 156A56 56 0 1 1 120 44" dur="10.4s" begin="0s" repeatCount="indefinite"/><g transform="translate(-120 -44)"><g class="fi10dhs-p" style="animation-delay:0.35s"><rect x="115.5" y="39.5" width="9" height="9" fill="#1F3ACB"/></g></g></g></svg>
