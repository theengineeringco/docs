<g class="fi10dhs-p" style="animation-delay:0.35s"><circle cx="148" cy="148.5" r="2.5" fill="#8A8985"/></g>
<g class="fi10dhs-p" style="animation-delay:0.4s"><circle cx="120" cy="156" r="2.5" fill="#8A8985"/></g>
<g class="fi10dhs-p" style="animation-delay:0.45s"><circle cx="92" cy="148.5" r="2.5" fill="#8A8985"/></g>
<g class="fi10dhs-p" style="animation-delay:0.5s"><circle cx="71.5" cy="128" r="2.5" fill="#8A8985"/></g>
<g class="fi10dhs-p" style="animation-delay:0.55s"><circle cx="64" cy="100" r="2.5" fill="#8A8985"/></g>
<g class="fi10dhs-p" style="animation-delay:0.6s"><circle cx="71.5" cy="72" r="2.5" fill="#8A8985"/></g>
