<svg xmlns="http://www.w3.org/2000/svg" width="240" height="200" viewBox="0 0 240 200" fill="none" role="img" class="firsk61"><title>Compare any two baselines</title><desc>Two snapshots side by side; the rows that changed between them stand out.</desc><style>.firsk61-p,.firsk61-f,.firsk61-r{transform-box:fill-box;transform-origin:center;animation-fill-mode:both}
.firsk61-p{animation-name:firsk61-pop;animation-duration:0.6s;animation-timing-function:cubic-bezier(.34,1.56,.64,1)}
@supports (animation-timing-function:linear(0,1)){.firsk61-p{animation-timing-function:linear(0, 0.083, 0.269, 0.487, 0.691, 0.855, 0.972, 1.043, 1.078, 1.086, 1.078, 1.061, 1.043, 1.025, 1.011, 1.002, 0.996, 0.993, 0.993, 0.993, 0.995, 0.996, 0.998, 0.999, 1)}}
.firsk61-f{animation-name:firsk61-fade;animation-duration:0.5s;animation-timing-function:ease-out}
.firsk61-r{animation-name:firsk61-rise;animation-duration:.7s;animation-timing-function:cubic-bezier(0.22,1,0.36,1)}
.firsk61-d{animation-name:firsk61-draw;animation-timing-function:cubic-bezier(0.65,0,0.35,1);animation-fill-mode:both}
.firsk61-m{animation:firsk61-march 2.6s linear infinite}
.firsk61-pulse{animation:firsk61-pulse 2.4s ease-in-out infinite}
@keyframes firsk61-pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes firsk61-fade{from{opacity:0}to{opacity:1}}
@keyframes firsk61-rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes firsk61-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes firsk61-march{from{stroke-dashoffset:0}to{stroke-dashoffset:-18}}
@keyframes firsk61-pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.firsk61 *{animation:none!important}.firsk61 .firsk61-d{stroke-dashoffset:0}.firsk61 .firsk61-t{display:none}}</style><defs><mask id="firsk61-k0" maskUnits="userSpaceOnUse" x="-240" y="-200" width="720" height="600"><path d="M78 72L162 72" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" class="firsk61-d" style="animation-duration:0.35s;animation-delay:0.05s"/></mask><mask id="firsk61-k1" maskUnits="userSpaceOnUse" x="-240" y="-200" width="720" height="600"><path d="M78 100L162 100" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" class="firsk61-d" style="animation-duration:0.35s;animation-delay:0.15s"/></mask><mask id="firsk61-k2" maskUnits="userSpaceOnUse" x="-240" y="-200" width="720" height="600"><path d="M78 128L162 128" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" class="firsk61-d" style="animation-duration:0.35s;animation-delay:0.25s"/></mask><mask id="firsk61-k3" maskUnits="userSpaceOnUse" x="-240" y="-200" width="720" height="600"><path d="M78 156L162 156" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" class="firsk61-d" style="animation-duration:0.35s;animation-delay:0.35s"/></mask></defs><path d="M78 72L162 72" fill="none" stroke="#E2E1DD" stroke-width="1" stroke-dasharray="4 5" stroke-linejoin="round" mask="url(#firsk61-k0)" class="firsk61-m"/>
<path d="M78 100L162 100" fill="none" stroke="#E2E1DD" stroke-width="1" stroke-dasharray="4 5" stroke-linejoin="round" mask="url(#firsk61-k1)" class="firsk61-m"/>
<path d="M78 128L162 128" fill="none" stroke="#E2E1DD" stroke-width="1" stroke-dasharray="4 5" stroke-linejoin="round" mask="url(#firsk61-k2)" class="firsk61-m"/>
<path d="M78 156L162 156" fill="none" stroke="#E2E1DD" stroke-width="1" stroke-dasharray="4 5" stroke-linejoin="round" mask="url(#firsk61-k3)" class="firsk61-m"/>
<path d="M78 40L78 156" fill="none" stroke="#C9C8C4" stroke-width="1" stroke-dasharray="1 1" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dashoffset="1" class="firsk61-d" style="animation-duration:0.45s;animation-delay:0.45s"/>
