<svg xmlns="http://www.w3.org/2000/svg" width="240" height="200" viewBox="0 0 240 200" fill="none" role="img" class="fiqh8xa"><title>Revert to any baseline</title><desc>Reverting proposes the inverse change on a branch, so going back is reviewed like going forward.</desc><style>.fiqh8xa-p,.fiqh8xa-f,.fiqh8xa-r{transform-box:fill-box;transform-origin:center;animation-fill-mode:both}
.fiqh8xa-p{animation-name:fiqh8xa-pop;animation-duration:0.6s;animation-timing-function:cubic-bezier(.34,1.56,.64,1)}
@supports (animation-timing-function:linear(0,1)){.fiqh8xa-p{animation-timing-function:linear(0, 0.083, 0.269, 0.487, 0.691, 0.855, 0.972, 1.043, 1.078, 1.086, 1.078, 1.061, 1.043, 1.025, 1.011, 1.002, 0.996, 0.993, 0.993, 0.993, 0.995, 0.996, 0.998, 0.999, 1)}}
.fiqh8xa-f{animation-name:fiqh8xa-fade;animation-duration:0.5s;animation-timing-function:ease-out}
.fiqh8xa-r{animation-name:fiqh8xa-rise;animation-duration:.7s;animation-timing-function:cubic-bezier(0.22,1,0.36,1)}
.fiqh8xa-d{animation-name:fiqh8xa-draw;animation-timing-function:cubic-bezier(0.65,0,0.35,1);animation-fill-mode:both}
.fiqh8xa-m{animation:fiqh8xa-march 2.6s linear infinite}
.fiqh8xa-pulse{animation:fiqh8xa-pulse 2.4s ease-in-out infinite}
@keyframes fiqh8xa-pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fiqh8xa-fade{from{opacity:0}to{opacity:1}}
@keyframes fiqh8xa-rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fiqh8xa-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fiqh8xa-march{from{stroke-dashoffset:0}to{stroke-dashoffset:-18}}
@keyframes fiqh8xa-pulse{0%,100%{opacity:1}50%{opacity:.35}}
