<svg xmlns="http://www.w3.org/2000/svg" width="240" height="200" viewBox="0 0 240 200" fill="none" role="img" class="fi4c6qp"><title>Variants</title><desc>Product families grow from one shared platform; each variant keeps what it shares.</desc><style>.fi4c6qp-p,.fi4c6qp-f,.fi4c6qp-r{transform-box:fill-box;transform-origin:center;animation-fill-mode:both}
.fi4c6qp-p{animation-name:fi4c6qp-pop;animation-duration:0.6s;animation-timing-function:cubic-bezier(.34,1.56,.64,1)}
