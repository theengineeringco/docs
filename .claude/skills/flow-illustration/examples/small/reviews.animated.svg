<svg xmlns="http://www.w3.org/2000/svg" width="240" height="200" viewBox="0 0 240 200" fill="none" role="img" class="fi18usi"><title>Required reviewers</title><desc>A change waits at the gate; two of three required reviewers have approved, so it cannot merge yet.</desc><style>.fi18usi-p,.fi18usi-f,.fi18usi-r{transform-box:fill-box;transform-origin:center;animation-fill-mode:both}
.fi18usi-p{animation-name:fi18usi-pop;animation-duration:0.6s;animation-timing-function:cubic-bezier(.34,1.56,.64,1)}
@supports (animation-timing-function:linear(0,1)){.fi18usi-p{animation-timing-function:linear(0, 0.083, 0.269, 0.487, 0.691, 0.855, 0.972, 1.043, 1.078, 1.086, 1.078, 1.061, 1.043, 1.025, 1.011, 1.002, 0.996, 0.993, 0.993, 0.993, 0.995, 0.996, 0.998, 0.999, 1)}}
.fi18usi-f{animation-name:fi18usi-fade;animation-duration:0.5s;animation-timing-function:ease-out}
.fi18usi-r{animation-name:fi18usi-rise;animation-duration:.7s;animation-timing-function:cubic-bezier(0.22,1,0.36,1)}
.fi18usi-d{animation-name:fi18usi-draw;animation-timing-function:cubic-bezier(0.65,0,0.35,1);animation-fill-mode:both}
.fi18usi-m{animation:fi18usi-march 2.6s linear infinite}
.fi18usi-pulse{animation:fi18usi-pulse 2.4s ease-in-out infinite}
@keyframes fi18usi-pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fi18usi-fade{from{opacity:0}to{opacity:1}}
@keyframes fi18usi-rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fi18usi-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fi18usi-march{from{stroke-dashoffset:0}to{stroke-dashoffset:-18}}
@keyframes fi18usi-pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.fi18usi *{animation:none!important}.fi18usi .fi18usi-d{stroke-dashoffset:0}.fi18usi .fi18usi-t{display:none}}</style><defs><mask id="fi18usi-k0" maskUnits="userSpaceOnUse" x="-240" y="-200" width="720" height="600"><path d="M62 128L182 128" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" class="fi18usi-d" style="animation-duration:0.46s;animation-delay:0.05s"/></mask><mask id="fi18usi-k1" maskUnits="userSpaceOnUse" x="-240" y="-200" width="720" height="600"><path d="M100 64L100 90" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" class="fi18usi-d" style="animation-duration:0.35s;animation-delay:0.15s"/></mask><mask id="fi18usi-k2" maskUnits="userSpaceOnUse" x="-240" y="-200" width="720" height="600"><path d="M136 64L136 114" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" class="fi18usi-d" style="animation-duration:0.35s;animation-delay:0.25s"/></mask><mask id="fi18usi-k3" maskUnits="userSpaceOnUse" x="-240" y="-200" width="720" height="600"><path d="M172 64L172 90" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" class="fi18usi-d" style="animation-duration:0.35s;animation-delay:0.35s"/></mask><mask id="fi18usi-k4" maskUnits="userSpaceOnUse" x="-240" y="-200" width="720" height="600"><path d="M100 90L172 90" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" class="fi18usi-d" style="animation-duration:0.35s;animation-delay:0.45s"/></mask></defs><path d="M62 128L182 128" fill="none" stroke="#C9C8C4" stroke-width="1" stroke-dasharray="4 5" stroke-linejoin="round" mask="url(#fi18usi-k0)" class="fi18usi-m"/>
<path d="M100 64L100 90" fill="none" stroke="#C9C8C4" stroke-width="1" stroke-dasharray="3 3" stroke-linejoin="round" mask="url(#fi18usi-k1)" class="fi18usi-m"/>
<path d="M136 64L136 114" fill="none" stroke="#C9C8C4" stroke-width="1" stroke-dasharray="3 3" stroke-linejoin="round" mask="url(#fi18usi-k2)" class="fi18usi-m"/>
<path d="M172 64L172 90" fill="none" stroke="#C9C8C4" stroke-width="1" stroke-dasharray="3 3" stroke-linejoin="round" mask="url(#fi18usi-k3)" class="fi18usi-m"/>
