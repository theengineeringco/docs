<g class="fi18usi-p" style="animation-delay:0.65s"><circle cx="62" cy="128" r="12" fill="#FFFFFF" stroke="#C9C8C4" stroke-width="1" stroke-dasharray="3 3" class="fi18usi-m"/><circle cx="62" cy="128" r="4" fill="none" stroke="#C9C8C4" stroke-width="1"/></g>
