<svg xmlns="http://www.w3.org/2000/svg" width="240" height="200" viewBox="0 0 240 200" fill="none" role="img" class="fim3uvo"><title>Every discipline, its own view</title><desc>One model seen three ways: each plane is the same items with a different set in focus.</desc><style>.fim3uvo-p,.fim3uvo-f,.fim3uvo-r{transform-box:fill-box;transform-origin:center;animation-fill-mode:both}
.fim3uvo-p{animation-name:fim3uvo-pop;animation-duration:0.6s;animation-timing-function:cubic-bezier(.34,1.56,.64,1)}
@supports (animation-timing-function:linear(0,1)){.fim3uvo-p{animation-timing-function:linear(0, 0.083, 0.269, 0.487, 0.691, 0.855, 0.972, 1.043, 1.078, 1.086, 1.078, 1.061, 1.043, 1.025, 1.011, 1.002, 0.996, 0.993, 0.993, 0.993, 0.995, 0.996, 0.998, 0.999, 1)}}
.fim3uvo-f{animation-name:fim3uvo-fade;animation-duration:0.5s;animation-timing-function:ease-out}
.fim3uvo-r{animation-name:fim3uvo-rise;animation-duration:.7s;animation-timing-function:cubic-bezier(0.22,1,0.36,1)}
.fim3uvo-d{animation-name:fim3uvo-draw;animation-timing-function:cubic-bezier(0.65,0,0.35,1);animation-fill-mode:both}
.fim3uvo-m{animation:fim3uvo-march 2.6s linear infinite}
.fim3uvo-pulse{animation:fim3uvo-pulse 2.4s ease-in-out infinite}
@keyframes fim3uvo-pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fim3uvo-fade{from{opacity:0}to{opacity:1}}
@keyframes fim3uvo-rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fim3uvo-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fim3uvo-march{from{stroke-dashoffset:0}to{stroke-dashoffset:-18}}
@keyframes fim3uvo-pulse{0%,100%{opacity:1}50%{opacity:.35}}
