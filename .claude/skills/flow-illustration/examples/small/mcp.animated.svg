<svg xmlns="http://www.w3.org/2000/svg" width="240" height="200" viewBox="0 0 240 200" fill="none" role="img" class="fi1kias"><title>Flow MCP</title><desc>Any AI client connects to the graph through one port each, across the boundary of the program.</desc><style>.fi1kias-p,.fi1kias-f,.fi1kias-r{transform-box:fill-box;transform-origin:center;animation-fill-mode:both}
.fi1kias-p{animation-name:fi1kias-pop;animation-duration:0.6s;animation-timing-function:cubic-bezier(.34,1.56,.64,1)}
@supports (animation-timing-function:linear(0,1)){.fi1kias-p{animation-timing-function:linear(0, 0.083, 0.269, 0.487, 0.691, 0.855, 0.972, 1.043, 1.078, 1.086, 1.078, 1.061, 1.043, 1.025, 1.011, 1.002, 0.996, 0.993, 0.993, 0.993, 0.995, 0.996, 0.998, 0.999, 1)}}
.fi1kias-f{animation-name:fi1kias-fade;animation-duration:0.5s;animation-timing-function:ease-out}
.fi1kias-r{animation-name:fi1kias-rise;animation-duration:.7s;animation-timing-function:cubic-bezier(0.22,1,0.36,1)}
.fi1kias-d{animation-name:fi1kias-draw;animation-timing-function:cubic-bezier(0.65,0,0.35,1);animation-fill-mode:both}
.fi1kias-m{animation:fi1kias-march 2.6s linear infinite}
.fi1kias-pulse{animation:fi1kias-pulse 2.4s ease-in-out infinite}
@keyframes fi1kias-pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fi1kias-fade{from{opacity:0}to{opacity:1}}
@keyframes fi1kias-rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fi1kias-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fi1kias-march{from{stroke-dashoffset:0}to{stroke-dashoffset:-18}}
@keyframes fi1kias-pulse{0%,100%{opacity:1}50%{opacity:.35}}
