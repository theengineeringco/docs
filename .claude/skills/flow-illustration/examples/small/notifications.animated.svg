<svg xmlns="http://www.w3.org/2000/svg" width="240" height="200" viewBox="0 0 240 200" fill="none" role="img" class="fi1vihr"><title>The right people, notified</title><desc>When a change lands, the owners of affected items hear about it where they work.</desc><style>.fi1vihr-p,.fi1vihr-f,.fi1vihr-r{transform-box:fill-box;transform-origin:center;animation-fill-mode:both}
.fi1vihr-p{animation-name:fi1vihr-pop;animation-duration:0.6s;animation-timing-function:cubic-bezier(.34,1.56,.64,1)}
@supports (animation-timing-function:linear(0,1)){.fi1vihr-p{animation-timing-function:linear(0, 0.083, 0.269, 0.487, 0.691, 0.855, 0.972, 1.043, 1.078, 1.086, 1.078, 1.061, 1.043, 1.025, 1.011, 1.002, 0.996, 0.993, 0.993, 0.993, 0.995, 0.996, 0.998, 0.999, 1)}}
.fi1vihr-f{animation-name:fi1vihr-fade;animation-duration:0.5s;animation-timing-function:ease-out}
.fi1vihr-r{animation-name:fi1vihr-rise;animation-duration:.7s;animation-timing-function:cubic-bezier(0.22,1,0.36,1)}
.fi1vihr-d{animation-name:fi1vihr-draw;animation-timing-function:cubic-bezier(0.65,0,0.35,1);animation-fill-mode:both}
.fi1vihr-m{animation:fi1vihr-march 2.6s linear infinite}
.fi1vihr-pulse{animation:fi1vihr-pulse 2.4s ease-in-out infinite}
@keyframes fi1vihr-pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fi1vihr-fade{from{opacity:0}to{opacity:1}}
@keyframes fi1vihr-rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fi1vihr-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fi1vihr-march{from{stroke-dashoffset:0}to{stroke-dashoffset:-18}}
@keyframes fi1vihr-pulse{0%,100%{opacity:1}50%{opacity:.35}}
