<svg xmlns="http://www.w3.org/2000/svg" width="240" height="200" viewBox="0 0 240 200" fill="none" role="img" class="fi1aovp"><title>Triggered from anywhere</title><desc>An event from outside crosses the boundary through one port and sets the agent to work.</desc><style>.fi1aovp-p,.fi1aovp-f,.fi1aovp-r{transform-box:fill-box;transform-origin:center;animation-fill-mode:both}
.fi1aovp-p{animation-name:fi1aovp-pop;animation-duration:0.6s;animation-timing-function:cubic-bezier(.34,1.56,.64,1)}
@supports (animation-timing-function:linear(0,1)){.fi1aovp-p{animation-timing-function:linear(0, 0.083, 0.269, 0.487, 0.691, 0.855, 0.972, 1.043, 1.078, 1.086, 1.078, 1.061, 1.043, 1.025, 1.011, 1.002, 0.996, 0.993, 0.993, 0.993, 0.995, 0.996, 0.998, 0.999, 1)}}
