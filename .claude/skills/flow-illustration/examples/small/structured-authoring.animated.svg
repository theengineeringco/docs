<svg xmlns="http://www.w3.org/2000/svg" width="240" height="200" viewBox="0 0 240 200" fill="none" role="img" class="fiyiq0l"><title>Written the same way</title><desc>Structured templates give every requirement the same shape, so checks can read them.</desc><style>.fiyiq0l-p,.fiyiq0l-f,.fiyiq0l-r{transform-box:fill-box;transform-origin:center;animation-fill-mode:both}
