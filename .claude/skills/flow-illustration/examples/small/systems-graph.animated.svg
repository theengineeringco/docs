<svg xmlns="http://www.w3.org/2000/svg" width="240" height="200" viewBox="0 0 240 200" fill="none" role="img" class="fiyxzgd"><title>One live model</title><desc>Every item in the program connected to one live centre.</desc><style>.fiyxzgd-p,.fiyxzgd-f,.fiyxzgd-r{transform-box:fill-box;transform-origin:center;animation-fill-mode:both}
.fiyxzgd-p{animation-name:fiyxzgd-pop;animation-duration:0.6s;animation-timing-function:cubic-bezier(.34,1.56,.64,1)}
@supports (animation-timing-function:linear(0,1)){.fiyxzgd-p{animation-timing-function:linear(0, 0.083, 0.269, 0.487, 0.691, 0.855, 0.972, 1.043, 1.078, 1.086, 1.078, 1.061, 1.043, 1.025, 1.011, 1.002, 0.996, 0.993, 0.993, 0.993, 0.995, 0.996, 0.998, 0.999, 1)}}
.fiyxzgd-f{animation-name:fiyxzgd-fade;animation-duration:0.5s;animation-timing-function:ease-out}
.fiyxzgd-r{animation-name:fiyxzgd-rise;animation-duration:.7s;animation-timing-function:cubic-bezier(0.22,1,0.36,1)}
.fiyxzgd-d{animation-name:fiyxzgd-draw;animation-timing-function:cubic-bezier(0.65,0,0.35,1);animation-fill-mode:both}
.fiyxzgd-m{animation:fiyxzgd-march 2.6s linear infinite}
.fiyxzgd-pulse{animation:fiyxzgd-pulse 2.4s ease-in-out infinite}
@keyframes fiyxzgd-pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fiyxzgd-fade{from{opacity:0}to{opacity:1}}
@keyframes fiyxzgd-rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fiyxzgd-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fiyxzgd-march{from{stroke-dashoffset:0}to{stroke-dashoffset:-18}}
@keyframes fiyxzgd-pulse{0%,100%{opacity:1}50%{opacity:.35}}
