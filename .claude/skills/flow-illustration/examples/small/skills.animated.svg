<svg xmlns="http://www.w3.org/2000/svg" width="240" height="200" viewBox="0 0 240 200" fill="none" role="img" class="fis4902"><title>Skills</title><desc>Standards encoded once hold every artifact in shape: squares at the corners, held by dashed edges.</desc><style>.fis4902-p,.fis4902-f,.fis4902-r{transform-box:fill-box;transform-origin:center;animation-fill-mode:both}
.fis4902-p{animation-name:fis4902-pop;animation-duration:0.6s;animation-timing-function:cubic-bezier(.34,1.56,.64,1)}
@supports (animation-timing-function:linear(0,1)){.fis4902-p{animation-timing-function:linear(0, 0.083, 0.269, 0.487, 0.691, 0.855, 0.972, 1.043, 1.078, 1.086, 1.078, 1.061, 1.043, 1.025, 1.011, 1.002, 0.996, 0.993, 0.993, 0.993, 0.995, 0.996, 0.998, 0.999, 1)}}
