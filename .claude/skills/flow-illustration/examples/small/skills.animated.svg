.fis4902-r{animation-name:fis4902-rise;animation-duration:.7s;animation-timing-function:cubic-bezier(0.22,1,0.36,1)}
.fis4902-d{animation-name:fis4902-draw;animation-timing-function:cubic-bezier(0.65,0,0.35,1);animation-fill-mode:both}
.fis4902-m{animation:fis4902-march 2.6s linear infinite}
.fis4902-pulse{animation:fis4902-pulse 2.4s ease-in-out infinite}
@keyframes fis4902-pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fis4902-fade{from{opacity:0}to{opacity:1}}
@keyframes fis4902-rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fis4902-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fis4902-march{from{stroke-dashoffset:0}to{stroke-dashoffset:-18}}
@keyframes fis4902-pulse{0%,100%{opacity:1}50%{opacity:.35}}
