<svg xmlns="http://www.w3.org/2000/svg" width="240" height="200" viewBox="0 0 240 200" fill="none" role="img" class="fi1ois7"><title>Sandboxed analysis</title><desc>Calculations run in an isolated box; only the result comes back into the reasoning.</desc><style>.fi1ois7-p,.fi1ois7-f,.fi1ois7-r{transform-box:fill-box;transform-origin:center;animation-fill-mode:both}
.fi1ois7-p{animation-name:fi1ois7-pop;animation-duration:0.6s;animation-timing-function:cubic-bezier(.34,1.56,.64,1)}
