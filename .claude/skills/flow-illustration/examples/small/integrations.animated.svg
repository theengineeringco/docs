ht="600"><path d="M120 100L59.38 65" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" class="fiwluiu-d" style="animation-duration:0.35s;animation-delay:0.5s"/></mask></defs><g class="fiwluiu-p" style="animation-delay:0.05s"><circle cx="120" cy="100" r="34" fill="none" stroke="#C9C8C4" stroke-width="1" stroke-dasharray="4 5" class="fiwluiu-m"/></g>
