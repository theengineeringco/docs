<svg xmlns="http://www.w3.org/2000/svg" width="240" height="200" viewBox="0 0 240 200" fill="none" role="img" class="fiwluiu"><title>Agents run across your tools</title><desc>Engineers stay in their tools; Flow connects to each through a port at its boundary.</desc><style>.fiwluiu-p,.fiwluiu-f,.fiwluiu-r{transform-box:fill-box;transform-origin:center;animation-fill-mode:both}
.fiwluiu-p{animation-name:fiwluiu-pop;animation-duration:0.6s;animation-timing-function:cubic-bezier(.34,1.56,.64,1)}
@supports (animation-timing-function:linear(0,1)){.fiwluiu-p{animation-timing-function:linear(0, 0.083, 0.269, 0.487, 0.691, 0.855, 0.972, 1.043, 1.078, 1.086, 1.078, 1.061, 1.043, 1.025, 1.011, 1.002, 0.996, 0.993, 0.993, 0.993, 0.995, 0.996, 0.998, 0.999, 1)}}
.fiwluiu-f{animation-name:fiwluiu-fade;animation-duration:0.5s;animation-timing-function:ease-out}
.fiwluiu-r{animation-name:fiwluiu-rise;animation-duration:.7s;animation-timing-function:cubic-bezier(0.22,1,0.36,1)}
.fiwluiu-d{animation-name:fiwluiu-draw;animation-timing-function:cubic-bezier(0.65,0,0.35,1);animation-fill-mode:both}
.fiwluiu-m{animation:fiwluiu-march 2.6s linear infinite}
.fiwluiu-pulse{animation:fiwluiu-pulse 2.4s ease-in-out infinite}
@keyframes fiwluiu-pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fiwluiu-fade{from{opacity:0}to{opacity:1}}
@keyframes fiwluiu-rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fiwluiu-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fiwluiu-march{from{stroke-dashoffset:0}to{stroke-dashoffset:-18}}
@keyframes fiwluiu-pulse{0%,100%{opacity:1}50%{opacity:.35}}
