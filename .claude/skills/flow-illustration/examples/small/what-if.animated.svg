path d="M116 100L180 100" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" class="fi1mkem-d" style="animation-duration:0.35s;animation-delay:0.55s"/></mask></defs><path d="M60 100L116 52" fill="none" stroke="#C9C8C4" stroke-width="1" stroke-dasharray="1 2.5" stroke-linejoin="round" mask="url(#fi1mkem-k0)"/>
