<svg xmlns="http://www.w3.org/2000/svg" width="240" height="200" viewBox="0 0 240 200" fill="none" role="img" class="fi1mkem"><title>Ask what if</title><desc>From the live node, alternatives are explored on the side; one is worked through to a result.</desc><style>.fi1mkem-p,.fi1mkem-f,.fi1mkem-r{transform-box:fill-box;transform-origin:center;animation-fill-mode:both}
.fi1mkem-p{animation-name:fi1mkem-pop;animation-duration:0.6s;animation-timing-function:cubic-bezier(.34,1.56,.64,1)}
