.fi1pwyl-m{animation:fi1pwyl-march 2.6s linear infinite}
.fi1pwyl-pulse{animation:fi1pwyl-pulse 2.4s ease-in-out infinite}
@keyframes fi1pwyl-pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fi1pwyl-fade{from{opacity:0}to{opacity:1}}
@keyframes fi1pwyl-rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fi1pwyl-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fi1pwyl-march{from{stroke-dashoffset:0}to{stroke-dashoffset:-18}}
@keyframes fi1pwyl-pulse{0%,100%{opacity:1}50%{opacity:.35}}
