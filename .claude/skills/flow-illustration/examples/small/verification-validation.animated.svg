<svg xmlns="http://www.w3.org/2000/svg" width="240" height="200" viewBox="0 0 240 200" fill="none" role="img" class="fi1pwyl"><title>Verified and validated, tracked apart</title><desc>Two separate signals per item: built right (squares) and built the right thing (still pending).</desc><style>.fi1pwyl-p,.fi1pwyl-f,.fi1pwyl-r{transform-box:fill-box;transform-origin:center;animation-fill-mode:both}
