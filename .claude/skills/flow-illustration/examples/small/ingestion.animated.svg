path d="M112 100L186 112" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" class="fijyq3h-d" style="animation-duration:0.35s;animation-delay:0.55s"/></mask><mask id="fijyq3h-k6" maskUnits="userSpaceOnUse" x="-240" y="-200" width="720" height="600"><path d="M112 100L186 136" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" class="fijyq3h-d" style="animation-duration:0.35s;animation-delay:0.65s"/></mask></defs><path d="M54 56L112 100" fill="none" stroke="#C9C8C4" stroke-width="1" stroke-dasharray="4 5" stroke-linejoin="round" mask="url(#fijyq3h-k0)" class="fijyq3h-m"/>
