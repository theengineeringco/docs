<svg xmlns="http://www.w3.org/2000/svg" width="240" height="200" viewBox="0 0 240 200" fill="none" role="img" class="fijyq3h"><title>Bring in existing specs</title><desc>Documents come in, the agent reads them, structured requirements come out with their source links.</desc><style>.fijyq3h-p,.fijyq3h-f,.fijyq3h-r{transform-box:fill-box;transform-origin:center;animation-fill-mode:both}
.fijyq3h-p{animation-name:fijyq3h-pop;animation-duration:0.6s;animation-timing-function:cubic-bezier(.34,1.56,.64,1)}
@supports (animation-timing-function:linear(0,1)){.fijyq3h-p{animation-timing-function:linear(0, 0.083, 0.269, 0.487, 0.691, 0.855, 0.972, 1.043, 1.078, 1.086, 1.078, 1.061, 1.043, 1.025, 1.011, 1.002, 0.996, 0.993, 0.993, 0.993, 0.995, 0.996, 0.998, 0.999, 1)}}
.fijyq3h-f{animation-name:fijyq3h-fade;animation-duration:0.5s;animation-timing-function:ease-out}
.fijyq3h-r{animation-name:fijyq3h-rise;animation-duration:.7s;animation-timing-function:cubic-bezier(0.22,1,0.36,1)}
.fijyq3h-d{animation-name:fijyq3h-draw;animation-timing-function:cubic-bezier(0.65,0,0.35,1);animation-fill-mode:both}
.fijyq3h-m{animation:fijyq3h-march 2.6s linear infinite}
.fijyq3h-pulse{animation:fijyq3h-pulse 2.4s ease-in-out infinite}
@keyframes fijyq3h-pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fijyq3h-fade{from{opacity:0}to{opacity:1}}
@keyframes fijyq3h-rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fijyq3h-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fijyq3h-march{from{stroke-dashoffset:0}to{stroke-dashoffset:-18}}
@keyframes fijyq3h-pulse{0%,100%{opacity:1}50%{opacity:.35}}
