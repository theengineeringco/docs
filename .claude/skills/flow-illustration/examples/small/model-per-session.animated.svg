<svg xmlns="http://www.w3.org/2000/svg" width="240" height="200" viewBox="0 0 240 200" fill="none" role="img" class="firwys1"><title>Choose the model per session</title><desc>Each chat session runs on the model you pick; the others stay available for the next one.</desc><style>.firwys1-p,.firwys1-f,.firwys1-r{transform-box:fill-box;transform-origin:center;animation-fill-mode:both}
.firwys1-p{animation-name:firwys1-pop;animation-duration:0.6s;animation-timing-function:cubic-bezier(.34,1.56,.64,1)}
@supports (animation-timing-function:linear(0,1)){.firwys1-p{animation-timing-function:linear(0, 0.083, 0.269, 0.487, 0.691, 0.855, 0.972, 1.043, 1.078, 1.086, 1.078, 1.061, 1.043, 1.025, 1.011, 1.002, 0.996, 0.993, 0.993, 0.993, 0.995, 0.996, 0.998, 0.999, 1)}}
.firwys1-f{animation-name:firwys1-fade;animation-duration:0.5s;animation-timing-function:ease-out}
.firwys1-r{animation-name:firwys1-rise;animation-duration:.7s;animation-timing-function:cubic-bezier(0.22,1,0.36,1)}
.firwys1-d{animation-name:firwys1-draw;animation-timing-function:cubic-bezier(0.65,0,0.35,1);animation-fill-mode:both}
.firwys1-m{animation:firwys1-march 2.6s linear infinite}
.firwys1-pulse{animation:firwys1-pulse 2.4s ease-in-out infinite}
@keyframes firwys1-pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes firwys1-fade{from{opacity:0}to{opacity:1}}
@keyframes firwys1-rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes firwys1-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes firwys1-march{from{stroke-dashoffset:0}to{stroke-dashoffset:-18}}
@keyframes firwys1-pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.firwys1 *{animation:none!important}.firwys1 .firwys1-d{stroke-dashoffset:0}.firwys1 .firwys1-t{display:none}}</style><defs><mask id="firwys1-k0" maskUnits="userSpaceOnUse" x="-240" y="-200" width="720" height="600"><path d="M120 100L120 42" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" class="firwys1-d" style="animation-duration:0.35s;animation-delay:0.25s"/></mask><mask id="firwys1-k1" maskUnits="userSpaceOnUse" x="-240" y="-200" width="720" height="600"><path d="M120 100L154.09 146.92" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" class="firwys1-d" style="animation-duration:0.35s;animation-delay:0.3s"/></mask><mask id="firwys1-k2" maskUnits="userSpaceOnUse" x="-240" y="-200" width="720" height="600"><path d="M120 100L85.91 146.92" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" class="firwys1-d" style="animation-duration:0.35s;animation-delay:0.35s"/></mask><mask id="firwys1-k3" maskUnits="userSpaceOnUse" x="-240" y="-200" width="720" height="600"><path d="M120 100L64.84 82.08" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" class="firwys1-d" style="animation-duration:0.35s;animation-delay:0.4s"/></mask><mask id="firwys1-k4" maskUnits="userSpaceOnUse" x="-240" y="-200" width="720" height="600"><path d="M120 100L175.16 82.08" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" class="firwys1-d" style="animation-duration:0.35s;animation-delay:0.75s"/></mask></defs><g class="firwys1-p" style="animation-delay:0.05s"><circle cx="120" cy="100" r="58" fill="none" stroke="#E2E1DD" stroke-width="1" stroke-dasharray="4 5" class="firwys1-m"/></g>
<path d="M120 100L120 42" fill="none" stroke="#E2E1DD" stroke-width="1" stroke-dasharray="4 5" stroke-linejoin="round" mask="url(#firwys1-k0)" class="firwys1-m"/>
<path d="M120 100L154.09 146.92" fill="none" stroke="#E2E1DD" stroke-width="1" stroke-dasharray="4 5" stroke-linejoin="round" mask="url(#firwys1-k1)" class="firwys1-m"/>
<path d="M120 100L85.91 146.92" fill="none" stroke="#E2E1DD" stroke-width="1" stroke-dasharray="4 5" stroke-linejoin="round" mask="url(#firwys1-k2)" class="firwys1-m"/>
<path d="M120 100L64.84 82.08" fill="none" stroke="#E2E1DD" stroke-width="1" stroke-dasharray="4 5" stroke-linejoin="round" mask="url(#firwys1-k3)" class="firwys1-m"/>
<path d="M120 100L175.16 82.08" fill="none" stroke="#1F3ACB" stroke-width="1" stroke-dasharray="4 5" stroke-linejoin="round" mask="url(#firwys1-k4)" class="firwys1-m"/>
<g class="firwys1-p" style="animation-delay:0.35s"><circle cx="120" cy="42" r="5" fill="#FFFFFF" stroke="#C9C8C4" stroke-width="1"/></g>
<g class="firwys1-p" style="animation-delay:0.4s"><circle cx="154.09" cy="146.92" r="5" fill="#FFFFFF" stroke="#C9C8C4" stroke-width="1"/></g>
<g class="firwys1-p" style="animation-delay:0.45s"><circle cx="85.91" cy="146.92" r="5" fill="#FFFFFF" stroke="#C9C8C4" stroke-width="1"/></g>
<g class="firwys1-p" style="animation-delay:0.5s"><circle cx="64.84" cy="82.08" r="5" fill="#FFFFFF" stroke="#C9C8C4" stroke-width="1"/></g>
<g class="firwys1-p" style="animation-delay:0.15s"><circle cx="120" cy="100" r="12" fill="#FFFFFF" stroke="#1F3ACB" stroke-width="1"/><rect x="116" y="96" width="8" height="8" fill="#1F3ACB"/></g>
<g class="firwys1-p" style="animation-delay:0.95s"><rect x="170.66" y="77.58" width="9" height="9" fill="#1F3ACB"/></g></svg>
