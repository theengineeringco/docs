.fi8qrdk-f{animation-name:fi8qrdk-fade;animation-duration:0.5s;animation-timing-function:ease-out}
.fi8qrdk-r{animation-name:fi8qrdk-rise;animation-duration:.7s;animation-timing-function:cubic-bezier(0.22,1,0.36,1)}
.fi8qrdk-d{animation-name:fi8qrdk-draw;animation-timing-function:cubic-bezier(0.65,0,0.35,1);animation-fill-mode:both}
.fi8qrdk-m{animation:fi8qrdk-march 2.6s linear infinite}
.fi8qrdk-pulse{animation:fi8qrdk-pulse 2.4s ease-in-out infinite}
@keyframes fi8qrdk-pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fi8qrdk-fade{from{opacity:0}to{opacity:1}}
@keyframes fi8qrdk-rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fi8qrdk-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fi8qrdk-march{from{stroke-dashoffset:0}to{stroke-dashoffset:-18}}
@keyframes fi8qrdk-pulse{0%,100%{opacity:1}50%{opacity:.35}}
