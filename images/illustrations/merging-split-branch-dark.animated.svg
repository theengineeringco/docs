<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" fill="none" role="img" class="fi8qrdk"><title>Splitting a branch</title><desc>Some of a branch's changes move to a new branch with the same parent and the same starting point. The moved changes keep their authors and times, and each branch can be reviewed and merged on its own.</desc><style>.fi8qrdk-p,.fi8qrdk-f,.fi8qrdk-r{transform-box:fill-box;transform-origin:center;animation-fill-mode:both}
.fi8qrdk-p{animation-name:fi8qrdk-pop;animation-duration:0.6s;animation-timing-function:cubic-bezier(.34,1.56,.64,1)}
