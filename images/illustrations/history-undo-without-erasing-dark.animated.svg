<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" fill="none" role="img" class="fi1pvuy"><title>Undo without erasing</title><desc>A revert adds the opposite change on its own branch and merges it. The value reads 100, then 120, then 100 again, and both changes stay in history.</desc><style>.fi1pvuy-p,.fi1pvuy-f,.fi1pvuy-r{transform-box:fill-box;transform-origin:center;animation-fill-mode:both}
.fi1pvuy-p{animation-name:fi1pvuy-pop;animation-duration:0.6s;animation-timing-function:cubic-bezier(.34,1.56,.64,1)}
