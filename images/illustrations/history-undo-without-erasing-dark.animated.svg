.fi1pvuy-r{animation-name:fi1pvuy-rise;animation-duration:.7s;animation-timing-function:cubic-bezier(0.22,1,0.36,1)}
.fi1pvuy-d{animation-name:fi1pvuy-draw;animation-timing-function:cubic-bezier(0.65,0,0.35,1);animation-fill-mode:both}
.fi1pvuy-m{animation:fi1pvuy-march 2.6s linear infinite}
.fi1pvuy-pulse{animation:fi1pvuy-pulse 2.4s ease-in-out infinite}
@keyframes fi1pvuy-pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fi1pvuy-fade{from{opacity:0}to{opacity:1}}
@keyframes fi1pvuy-rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fi1pvuy-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fi1pvuy-march{from{stroke-dashoffset:0}to{stroke-dashoffset:-18}}
@keyframes fi1pvuy-pulse{0%,100%{opacity:1}50%{opacity:.35}}
