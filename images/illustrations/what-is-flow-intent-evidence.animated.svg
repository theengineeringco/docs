<svg xmlns="http://www.w3.org/2000/svg" width="640" height="250" viewBox="0 0 640 250" fill="none" role="img" class="figdljd"><title>Intent, evidence, and the gap between them</title><desc>Flow connects each target to the evidence for it: one target is met, one is close but not there, and one has no evidence yet.</desc><style>.figdljd-p,.figdljd-f,.figdljd-r{transform-box:fill-box;transform-origin:center;animation-fill-mode:both}
.figdljd-p{animation-name:figdljd-pop;animation-duration:0.6s;animation-timing-function:cubic-bezier(.34,1.56,.64,1)}
@supports (animation-timing-function:linear(0,1)){.figdljd-p{animation-timing-function:linear(0, 0.083, 0.269, 0.487, 0.691, 0.855, 0.972, 1.043, 1.078, 1.086, 1.078, 1.061, 1.043, 1.025, 1.011, 1.002, 0.996, 0.993, 0.993, 0.993, 0.995, 0.996, 0.998, 0.999, 1)}}
.figdljd-f{animation-name:figdljd-fade;animation-duration:0.5s;animation-timing-function:ease-out}
.figdljd-r{animation-name:figdljd-rise;animation-duration:.7s;animation-timing-function:cubic-bezier(0.22,1,0.36,1)}
.figdljd-d{animation-name:figdljd-draw;animation-timing-function:cubic-bezier(0.65,0,0.35,1);animation-fill-mode:both}
.figdljd-m{animation:figdljd-march 2.6s linear infinite}
.figdljd-pulse{animation:figdljd-pulse 2.4s ease-in-out infinite}
@keyframes figdljd-pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes figdljd-fade{from{opacity:0}to{opacity:1}}
@keyframes figdljd-rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes figdljd-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes figdljd-march{from{stroke-dashoffset:0}to{stroke-dashoffset:-18}}
@keyframes figdljd-pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.figdljd *{animation:none!important}.figdljd .figdljd-d{stroke-dashoffset:0}.figdljd .figdljd-t{display:none}}</style><defs><mask id="figdljd-k0" maskUnits="userSpaceOnUse" x="-640" y="-250" width="1920" height="750"><path d="M110 120L280 70" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" class="figdljd-d" style="animation-duration:0.68s;animation-delay:0.05s"/></mask><mask id="figdljd-k1" maskUnits="userSpaceOnUse" x="-640" y="-250" width="1920" height="750"><path d="M110 120L280 120" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" class="figdljd-d" style="animation-duration:0.65s;animation-delay:0.12s"/></mask><mask id="figdljd-k2" maskUnits="userSpaceOnUse" x="-640" y="-250" width="1920" height="750"><path d="M110 120L280 170" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" class="figdljd-d" style="animation-duration:0.68s;animation-delay:0.19s"/></mask><mask id="figdljd-k3" maskUnits="userSpaceOnUse" x="-640" y="-250" width="1920" height="750"><path d="M280 70L480 70" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" class="figdljd-d" style="animation-duration:0.77s;animation-delay:0.26s"/></mask><mask id="figdljd-k4" maskUnits="userSpaceOnUse" x="-640" y="-250" width="1920" height="750"><path d="M280 120L480 120" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" class="figdljd-d" style="animation-duration:0.77s;animation-delay:0.33s"/></mask><mask id="figdljd-k5" maskUnits="userSpaceOnUse" x="-640" y="-250" width="1920" height="750"><path d="M280 170L480 170" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" class="figdljd-d" style="animation-duration:0.77s;animation-delay:0.4s"/></mask></defs><path d="M110 120L280 70" fill="none" stroke="#C9C8C4" stroke-width="1" stroke-dasharray="4 5" stroke-linejoin="round" mask="url(#figdljd-k0)" class="figdljd-m"/>
<path d="M110 120L280 120" fill="none" stroke="#C9C8C4" stroke-width="1" stroke-dasharray="4 5" stroke-linejoin="round" mask="url(#figdljd-k1)" class="figdljd-m"/>
<path d="M110 120L280 170" fill="none" stroke="#C9C8C4" stroke-width="1" stroke-dasharray="4 5" stroke-linejoin="round" mask="url(#figdljd-k2)" class="figdljd-m"/>
<path d="M280 70L480 70" fill="none" stroke="#C9C8C4" stroke-width="1" stroke-dasharray="4 5" stroke-linejoin="round" mask="url(#figdljd-k3)" class="figdljd-m"/>
<path d="M280 120L480 120" fill="none" stroke="#C9C8C4" stroke-width="1" stroke-dasharray="4 5" stroke-linejoin="round" mask="url(#figdljd-k4)" class="figdljd-m"/>
<path d="M280 170L480 170" fill="none" stroke="#C9C8C4" stroke-width="1" stroke-dasharray="1 2.5" stroke-linejoin="round" mask="url(#figdljd-k5)"/>
<g class="figdljd-p" style="animation-delay:0.05s"><circle cx="110" cy="120" r="12" fill="#FDFDFB" stroke="#1F3ACB" stroke-width="1"/><rect x="106" y="116" width="8" height="8" fill="#1F3ACB"/></g>
<g class="figdljd-p" style="animation-delay:0.47s"><circle cx="280" cy="70" r="5" fill="#FDFDFB" stroke="#C9C8C4" stroke-width="1"/></g>
<g class="figdljd-p" style="animation-delay:0.54s"><circle cx="280" cy="120" r="5" fill="#FDFDFB" stroke="#C9C8C4" stroke-width="1"/></g>
<g class="figdljd-p" style="animation-delay:0.61s"><circle cx="280" cy="170" r="5" fill="#FDFDFB" stroke="#C9C8C4" stroke-width="1"/></g>
<g class="figdljd-p" style="animation-delay:0.68s"><rect x="475.5" y="65.5" width="9" height="9" fill="#1F3ACB"/></g>
<g class="figdljd-p" style="animation-delay:0.75s"><g class="figdljd-pulse"><path d="M480 114.24L485.76 120L480 125.76L474.24 120Z" fill="#E29B03" stroke-linejoin="round"/></g></g>
<g class="figdljd-p" style="animation-delay:0.82s"><circle cx="480" cy="170" r="5" fill="#FDFDFB" stroke="#C9C8C4" stroke-width="1" stroke-dasharray="3 3"/></g>
<g class="figdljd-f" style="animation-delay:0.89s"><text x="280" y="48" fill="#8F8E8A" font-family="'Commit Mono', 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle" letter-spacing="0.24">intent</text></g>
<g class="figdljd-f" style="animation-delay:0.96s"><text x="480" y="48" fill="#8F8E8A" font-family="'Commit Mono', 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle" letter-spacing="0.24">evidence</text></g>
<g class="figdljd-f" style="animation-delay:1.03s"><text x="496" y="74" fill="#8F8E8A" font-family="'Commit Mono', 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="start" letter-spacing="0.24">met</text></g>
<g class="figdljd-f" style="animation-delay:1.1s"><text x="496" y="124" fill="#8F8E8A" font-family="'Commit Mono', 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="start" letter-spacing="0.24">close</text></g>
<g class="figdljd-f" style="animation-delay:1.17s"><text x="496" y="174" fill="#8F8E8A" font-family="'Commit Mono', 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="start" letter-spacing="0.24">none yet</text></g></svg>
