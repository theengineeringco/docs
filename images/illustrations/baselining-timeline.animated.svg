<svg xmlns="http://www.w3.org/2000/svg" width="600" height="260" viewBox="0 0 600 260" fill="none" role="img" class="fi54jjb"><title>Baselines on a branch's timeline</title><desc>Baselines mark two points in Base's history. Compare them with each other, or a baseline with the current state. A baseline copies nothing.</desc><style>.fi54jjb-p,.fi54jjb-f,.fi54jjb-r{transform-box:fill-box;transform-origin:center;animation-fill-mode:both}
.fi54jjb-p{animation-name:fi54jjb-pop;animation-duration:0.6s;animation-timing-function:cubic-bezier(.34,1.56,.64,1)}
@supports (animation-timing-function:linear(0,1)){.fi54jjb-p{animation-timing-function:linear(0, 0.083, 0.269, 0.487, 0.691, 0.855, 0.972, 1.043, 1.078, 1.086, 1.078, 1.061, 1.043, 1.025, 1.011, 1.002, 0.996, 0.993, 0.993, 0.993, 0.995, 0.996, 0.998, 0.999, 1)}}
.fi54jjb-f{animation-name:fi54jjb-fade;animation-duration:0.5s;animation-timing-function:ease-out}
.fi54jjb-r{animation-name:fi54jjb-rise;animation-duration:.7s;animation-timing-function:cubic-bezier(0.22,1,0.36,1)}
.fi54jjb-d{animation-name:fi54jjb-draw;animation-timing-function:cubic-bezier(0.65,0,0.35,1);animation-fill-mode:both}
.fi54jjb-m{animation:fi54jjb-march 2.6s linear infinite}
.fi54jjb-pulse{animation:fi54jjb-pulse 2.4s ease-in-out infinite}
@keyframes fi54jjb-pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fi54jjb-fade{from{opacity:0}to{opacity:1}}
@keyframes fi54jjb-rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fi54jjb-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fi54jjb-march{from{stroke-dashoffset:0}to{stroke-dashoffset:-18}}
@keyframes fi54jjb-pulse{0%,100%{opacity:1}50%{opacity:.35}}
