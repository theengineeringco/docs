<svg xmlns="http://www.w3.org/2000/svg" width="600" height="280" viewBox="0 0 600 280" fill="none" role="img" class="fibeqqh"><title>Every change stays on the record</title><desc>A proposal branches from Base, takes in a newer change from Base, and merges back as a recorded merge. A revert later undoes part of it on its own branch, and every change stays visible.</desc><style>.fibeqqh-p,.fibeqqh-f,.fibeqqh-r{transform-box:fill-box;transform-origin:center;animation-fill-mode:both}
.fibeqqh-p{animation-name:fibeqqh-pop;animation-duration:0.6s;animation-timing-function:cubic-bezier(.34,1.56,.64,1)}
@supports (animation-timing-function:linear(0,1)){.fibeqqh-p{animation-timing-function:linear(0, 0.083, 0.269, 0.487, 0.691, 0.855, 0.972, 1.043, 1.078, 1.086, 1.078, 1.061, 1.043, 1.025, 1.011, 1.002, 0.996, 0.993, 0.993, 0.993, 0.995, 0.996, 0.998, 0.999, 1)}}
.fibeqqh-f{animation-name:fibeqqh-fade;animation-duration:0.5s;animation-timing-function:ease-out}
.fibeqqh-r{animation-name:fibeqqh-rise;animation-duration:.7s;animation-timing-function:cubic-bezier(0.22,1,0.36,1)}
.fibeqqh-d{animation-name:fibeqqh-draw;animation-timing-function:cubic-bezier(0.65,0,0.35,1);animation-fill-mode:both}
.fibeqqh-m{animation:fibeqqh-march 2.6s linear infinite}
.fibeqqh-pulse{animation:fibeqqh-pulse 2.4s ease-in-out infinite}
@keyframes fibeqqh-pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fibeqqh-fade{from{opacity:0}to{opacity:1}}
@keyframes fibeqqh-rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fibeqqh-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fibeqqh-march{from{stroke-dashoffset:0}to{stroke-dashoffset:-18}}
@keyframes fibeqqh-pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.fibeqqh *{animation:none!important}.fibeqqh .fibeqqh-d{stroke-dashoffset:0}.fibeqqh .fibeqqh-t{display:none}}</style><defs><mask id="fibeqqh-k0" maskUnits="userSpaceOnUse" x="-600" y="-280" width="1800" height="840"><path d="M48 150L552 150" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" class="fibeqqh-d" style="animation-duration:0.9s;animation-delay:0.05s"/></mask><mask id="fibeqqh-k1" maskUnits="userSpaceOnUse" x="-600" y="-280" width="1800" height="840"><path d="M108.48 150L108.48 96L108.64 93.66L109.1 91.63L109.89 89.91L110.98 88.5L112.39 87.41L114.1 86.63L116.14 86.16L118.48 86L350.48 86L352.82 86.16L354.86 86.63L356.57 87.41L357.98 88.5L359.07 89.91L359.86 91.63L360.32 93.66L360.48 96L360.48 150" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" class="fibeqqh-d" style="animation-duration:0.9s;animation-delay:0.2s"/></mask><mask id="fibeqqh-k2" maskUnits="userSpaceOnUse" x="-600" y="-280" width="1800" height="840"><path d="M410.88 150L410.88 204L411.04 206.34L411.51 208.38L412.29 210.09L413.38 211.5L414.79 212.59L416.51 213.38L418.54 213.84L420.88 214L501.68 214L504.02 213.84L506.06 213.38L507.77 212.59L509.18 211.5L510.27 210.09L511.05 208.38L511.52 206.34L511.68 204L511.68 150" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" class="fibeqqh-d" style="animation-duration:0.85s;animation-delay:0.57s"/></mask><mask id="fibeqqh-k3" maskUnits="userSpaceOnUse" x="-600" y="-280" width="1800" height="840"><path d="M229.4 150L264.7 86" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" class="fibeqqh-d" style="animation-duration:0.35s;animation-delay:0.68s"/></mask></defs><path d="M48 150L552 150" fill="none" stroke="#8F8E8A" stroke-width="1" stroke-dasharray="4 5" stroke-linejoin="round" mask="url(#fibeqqh-k0)" class="fibeqqh-m"/>
