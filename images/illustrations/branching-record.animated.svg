<path d="M511.68 136L511.68 146" fill="none" stroke="#8F8E8A" stroke-width="1" stroke-dasharray="1 1" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dashoffset="1" class="fibeqqh-d" style="animation-duration:0.35s;animation-delay:1.28s"/>
