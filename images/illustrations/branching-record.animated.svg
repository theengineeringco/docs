<g class="fibeqqh-f" style="animation-delay:1.42s"><text x="48" y="176" fill="#6B6A66" font-family="'Commit Mono', 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle" letter-spacing="0.24">Base</text></g>
