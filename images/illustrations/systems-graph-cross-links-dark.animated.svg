<svg xmlns="http://www.w3.org/2000/svg" width="640" height="310" viewBox="0 0 640 310" fill="none" role="img" class="fiq39rx"><title>Hierarchy plus cross-links</title><desc>The vehicle breaks down into systems and parts. Cross-links add what the tree cannot: an interface between the pack and the BMS, and a range target that depends on both the pack and the drag coefficient.</desc><style>.fiq39rx-p,.fiq39rx-f,.fiq39rx-r{transform-box:fill-box;transform-origin:center;animation-fill-mode:both}
.fiq39rx-p{animation-name:fiq39rx-pop;animation-duration:0.6s;animation-timing-function:cubic-bezier(.34,1.56,.64,1)}
@supports (animation-timing-function:linear(0,1)){.fiq39rx-p{animation-timing-function:linear(0, 0.083, 0.269, 0.487, 0.691, 0.855, 0.972, 1.043, 1.078, 1.086, 1.078, 1.061, 1.043, 1.025, 1.011, 1.002, 0.996, 0.993, 0.993, 0.993, 0.995, 0.996, 0.998, 0.999, 1)}}
.fiq39rx-f{animation-name:fiq39rx-fade;animation-duration:0.5s;animation-timing-function:ease-out}
.fiq39rx-r{animation-name:fiq39rx-rise;animation-duration:.7s;animation-timing-function:cubic-bezier(0.22,1,0.36,1)}
.fiq39rx-d{animation-name:fiq39rx-draw;animation-timing-function:cubic-bezier(0.65,0,0.35,1);animation-fill-mode:both}
.fiq39rx-m{animation:fiq39rx-march 2.6s linear infinite}
.fiq39rx-pulse{animation:fiq39rx-pulse 2.4s ease-in-out infinite}
@keyframes fiq39rx-pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fiq39rx-fade{from{opacity:0}to{opacity:1}}
@keyframes fiq39rx-rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fiq39rx-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fiq39rx-march{from{stroke-dashoffset:0}to{stroke-dashoffset:-18}}
@keyframes fiq39rx-pulse{0%,100%{opacity:1}50%{opacity:.35}}
