<svg xmlns="http://www.w3.org/2000/svg" width="600" height="330" viewBox="0 0 600 330" fill="none" role="img" class="fico3o1"><title>What a merge does</title><desc>The proposal merges into Base and closes. The merge is one record on Base, a Merge baseline, that holds who merged it, the reviews, the discussion, and the changed items.</desc><style>.fico3o1-p,.fico3o1-f,.fico3o1-r{transform-box:fill-box;transform-origin:center;animation-fill-mode:both}
.fico3o1-p{animation-name:fico3o1-pop;animation-duration:0.6s;animation-timing-function:cubic-bezier(.34,1.56,.64,1)}
@supports (animation-timing-function:linear(0,1)){.fico3o1-p{animation-timing-function:linear(0, 0.083, 0.269, 0.487, 0.691, 0.855, 0.972, 1.043, 1.078, 1.086, 1.078, 1.061, 1.043, 1.025, 1.011, 1.002, 0.996, 0.993, 0.993, 0.993, 0.995, 0.996, 0.998, 0.999, 1)}}
.fico3o1-f{animation-name:fico3o1-fade;animation-duration:0.5s;animation-timing-function:ease-out}
.fico3o1-r{animation-name:fico3o1-rise;animation-duration:.7s;animation-timing-function:cubic-bezier(0.22,1,0.36,1)}
.fico3o1-d{animation-name:fico3o1-draw;animation-timing-function:cubic-bezier(0.65,0,0.35,1);animation-fill-mode:both}
.fico3o1-m{animation:fico3o1-march 2.6s linear infinite}
.fico3o1-pulse{animation:fico3o1-pulse 2.4s ease-in-out infinite}
@keyframes fico3o1-pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fico3o1-fade{from{opacity:0}to{opacity:1}}
@keyframes fico3o1-rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fico3o1-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fico3o1-march{from{stroke-dashoffset:0}to{stroke-dashoffset:-18}}
@keyframes fico3o1-pulse{0%,100%{opacity:1}50%{opacity:.35}}
