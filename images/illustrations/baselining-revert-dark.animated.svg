<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" fill="none" role="img" class="fi131hx"><title>Reverting a baseline</title><desc>Reverting the Design review 1 baseline opens a branch from Base's latest state holding the reverse of only that baseline's own changes. Later changes are kept, and nothing on Base changes until the revert branch is merged.</desc><style>.fi131hx-p,.fi131hx-f,.fi131hx-r{transform-box:fill-box;transform-origin:center;animation-fill-mode:both}
.fi131hx-p{animation-name:fi131hx-pop;animation-duration:0.6s;animation-timing-function:cubic-bezier(.34,1.56,.64,1)}
@supports (animation-timing-function:linear(0,1)){.fi131hx-p{animation-timing-function:linear(0, 0.083, 0.269, 0.487, 0.691, 0.855, 0.972, 1.043, 1.078, 1.086, 1.078, 1.061, 1.043, 1.025, 1.011, 1.002, 0.996, 0.993, 0.993, 0.993, 0.995, 0.996, 0.998, 0.999, 1)}}
.fi131hx-f{animation-name:fi131hx-fade;animation-duration:0.5s;animation-timing-function:ease-out}
.fi131hx-r{animation-name:fi131hx-rise;animation-duration:.7s;animation-timing-function:cubic-bezier(0.22,1,0.36,1)}
.fi131hx-d{animation-name:fi131hx-draw;animation-timing-function:cubic-bezier(0.65,0,0.35,1);animation-fill-mode:both}
.fi131hx-m{animation:fi131hx-march 2.6s linear infinite}
.fi131hx-pulse{animation:fi131hx-pulse 2.4s ease-in-out infinite}
@keyframes fi131hx-pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fi131hx-fade{from{opacity:0}to{opacity:1}}
@keyframes fi131hx-rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fi131hx-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fi131hx-march{from{stroke-dashoffset:0}to{stroke-dashoffset:-18}}
@keyframes fi131hx-pulse{0%,100%{opacity:1}50%{opacity:.35}}
