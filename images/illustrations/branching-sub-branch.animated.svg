<svg xmlns="http://www.w3.org/2000/svg" width="600" height="280" viewBox="0 0 600 280" fill="none" role="img" class="fi17zim"><title>A sub-branch on a proposal</title><desc>A sub-branch starts from a proposal, not from Base, and merges back into the proposal. The proposal then merges into Base.</desc><style>.fi17zim-p,.fi17zim-f,.fi17zim-r{transform-box:fill-box;transform-origin:center;animation-fill-mode:both}
.fi17zim-p{animation-name:fi17zim-pop;animation-duration:0.6s;animation-timing-function:cubic-bezier(.34,1.56,.64,1)}
@supports (animation-timing-function:linear(0,1)){.fi17zim-p{animation-timing-function:linear(0, 0.083, 0.269, 0.487, 0.691, 0.855, 0.972, 1.043, 1.078, 1.086, 1.078, 1.061, 1.043, 1.025, 1.011, 1.002, 0.996, 0.993, 0.993, 0.993, 0.995, 0.996, 0.998, 0.999, 1)}}
.fi17zim-f{animation-name:fi17zim-fade;animation-duration:0.5s;animation-timing-function:ease-out}
.fi17zim-r{animation-name:fi17zim-rise;animation-duration:.7s;animation-timing-function:cubic-bezier(0.22,1,0.36,1)}
.fi17zim-d{animation-name:fi17zim-draw;animation-timing-function:cubic-bezier(0.65,0,0.35,1);animation-fill-mode:both}
.fi17zim-m{animation:fi17zim-march 2.6s linear infinite}
.fi17zim-pulse{animation:fi17zim-pulse 2.4s ease-in-out infinite}
@keyframes fi17zim-pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fi17zim-fade{from{opacity:0}to{opacity:1}}
@keyframes fi17zim-rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fi17zim-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fi17zim-march{from{stroke-dashoffset:0}to{stroke-dashoffset:-18}}
@keyframes fi17zim-pulse{0%,100%{opacity:1}50%{opacity:.35}}
