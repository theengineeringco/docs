<svg xmlns="http://www.w3.org/2000/svg" width="600" height="260" viewBox="0 0 600 260" fill="none" role="img" class="fiechd4"><title>Updating from the parent</title><desc>A newer change on Base is taken into an open proposal. A field both changed is a conflict you settle once; Base itself is unchanged.</desc><style>.fiechd4-p,.fiechd4-f,.fiechd4-r{transform-box:fill-box;transform-origin:center;animation-fill-mode:both}
.fiechd4-p{animation-name:fiechd4-pop;animation-duration:0.6s;animation-timing-function:cubic-bezier(.34,1.56,.64,1)}
@supports (animation-timing-function:linear(0,1)){.fiechd4-p{animation-timing-function:linear(0, 0.083, 0.269, 0.487, 0.691, 0.855, 0.972, 1.043, 1.078, 1.086, 1.078, 1.061, 1.043, 1.025, 1.011, 1.002, 0.996, 0.993, 0.993, 0.993, 0.995, 0.996, 0.998, 0.999, 1)}}
.fiechd4-f{animation-name:fiechd4-fade;animation-duration:0.5s;animation-timing-function:ease-out}
.fiechd4-r{animation-name:fiechd4-rise;animation-duration:.7s;animation-timing-function:cubic-bezier(0.22,1,0.36,1)}
.fiechd4-d{animation-name:fiechd4-draw;animation-timing-function:cubic-bezier(0.65,0,0.35,1);animation-fill-mode:both}
.fiechd4-m{animation:fiechd4-march 2.6s linear infinite}
.fiechd4-pulse{animation:fiechd4-pulse 2.4s ease-in-out infinite}
@keyframes fiechd4-pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fiechd4-fade{from{opacity:0}to{opacity:1}}
@keyframes fiechd4-rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fiechd4-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fiechd4-march{from{stroke-dashoffset:0}to{stroke-dashoffset:-18}}
@keyframes fiechd4-pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.fiechd4 *{animation:none!important}.fiechd4 .fiechd4-d{stroke-dashoffset:0}.fiechd4 .fiechd4-t{display:none}}</style><defs><mask id="fiechd4-k0" maskUnits="userSpaceOnUse" x="-600" y="-260" width="1800" height="780"><path d="M48 170L552 170" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" class="fiechd4-d" style="animation-duration:0.9s;animation-delay:0.05s"/></mask><mask id="fiechd4-k1" maskUnits="userSpaceOnUse" x="-600" y="-260" width="1800" height="780"><path d="M98.4 170L98.4 110L98.56 107.66L99.03 105.63L99.81 103.91L100.9 102.5L102.31 101.41L104.03 100.63L106.06 100.16L108.4 100L521.76 100" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" class="fiechd4-d" style="animation-duration:0.9s;animation-delay:0.18s"/></mask><mask id="fiechd4-k2" maskUnits="userSpaceOnUse" x="-600" y="-260" width="1800" height="780"><path d="M279.8 170L301.6 100" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" class="fiechd4-d" style="animation-duration:0.35s;animation-delay:0.68s"/></mask></defs><path d="M48 170L552 170" fill="none" stroke="#85847F" stroke-width="1" stroke-dasharray="4 5" stroke-linejoin="round" mask="url(#fiechd4-k0)" class="fiechd4-m"/>
<path d="M98.4 170L98.4 110L98.56 107.66L99.03 105.63L99.81 103.91L100.9 102.5L102.31 101.41L104.03 100.63L106.06 100.16L108.4 100L521.76 100" fill="none" stroke="#85847F" stroke-width="1" stroke-dasharray="4 5" stroke-linejoin="round" mask="url(#fiechd4-k1)" class="fiechd4-m"/>
<path d="M279.8 170L301.6 100" fill="none" stroke="#85847F" stroke-width="1" stroke-dasharray="3 3" stroke-linejoin="round" mask="url(#fiechd4-k2)" class="fiechd4-m"/>
