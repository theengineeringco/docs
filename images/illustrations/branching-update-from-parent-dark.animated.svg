<g class="fiechd4-f" style="animation-delay:1.18s"><text x="301.6" y="82" fill="#B3B2AD" font-family="'Commit Mono', 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle" letter-spacing="0.24">conflict</text></g>
