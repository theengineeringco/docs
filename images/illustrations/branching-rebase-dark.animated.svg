<svg xmlns="http://www.w3.org/2000/svg" width="600" height="320" viewBox="0 0 600 320" fill="none" role="img" class="fi7f6ri"><title>Rebase onto a new parent</title><desc>A proposal started from Base by mistake is copied onto Truck. The copy keeps each change's author and time; the original proposal is left unchanged.</desc><style>.fi7f6ri-p,.fi7f6ri-f,.fi7f6ri-r{transform-box:fill-box;transform-origin:center;animation-fill-mode:both}
