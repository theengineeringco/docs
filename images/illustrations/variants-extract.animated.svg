<svg xmlns="http://www.w3.org/2000/svg" width="600" height="330" viewBox="0 0 600 330" fill="none" role="img" class="fi13zno"><title>Extracting non-variant changes</title><desc>Extracting copies a shared fix from the Truck variant to a new branch from the chosen target, here Base. Truck-only changes stay behind, Truck is unchanged, and the new branch stays open until it is reviewed and merged.</desc><style>.fi13zno-p,.fi13zno-f,.fi13zno-r{transform-box:fill-box;transform-origin:center;animation-fill-mode:both}
.fi13zno-p{animation-name:fi13zno-pop;animation-duration:0.6s;animation-timing-function:cubic-bezier(.34,1.56,.64,1)}
@supports (animation-timing-function:linear(0,1)){.fi13zno-p{animation-timing-function:linear(0, 0.083, 0.269, 0.487, 0.691, 0.855, 0.972, 1.043, 1.078, 1.086, 1.078, 1.061, 1.043, 1.025, 1.011, 1.002, 0.996, 0.993, 0.993, 0.993, 0.995, 0.996, 0.998, 0.999, 1)}}
.fi13zno-f{animation-name:fi13zno-fade;animation-duration:0.5s;animation-timing-function:ease-out}
.fi13zno-r{animation-name:fi13zno-rise;animation-duration:.7s;animation-timing-function:cubic-bezier(0.22,1,0.36,1)}
.fi13zno-d{animation-name:fi13zno-draw;animation-timing-function:cubic-bezier(0.65,0,0.35,1);animation-fill-mode:both}
.fi13zno-m{animation:fi13zno-march 2.6s linear infinite}
.fi13zno-pulse{animation:fi13zno-pulse 2.4s ease-in-out infinite}
@keyframes fi13zno-pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fi13zno-fade{from{opacity:0}to{opacity:1}}
@keyframes fi13zno-rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fi13zno-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fi13zno-march{from{stroke-dashoffset:0}to{stroke-dashoffset:-18}}
@keyframes fi13zno-pulse{0%,100%{opacity:1}50%{opacity:.35}}
