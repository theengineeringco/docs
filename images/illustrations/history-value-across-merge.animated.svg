@keyframes fi1dqi1-pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fi1dqi1-fade{from{opacity:0}to{opacity:1}}
@keyframes fi1dqi1-rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fi1dqi1-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fi1dqi1-march{from{stroke-dashoffset:0}to{stroke-dashoffset:-18}}
