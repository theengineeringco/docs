<svg xmlns="http://www.w3.org/2000/svg" width="600" height="320" viewBox="0 0 600 320" fill="none" role="img" class="fisn2po"><title>Variants and proposals</title><desc>Three variants branch from Base and run alongside it without merging back. Proposals branch from a variant and merge back into it when accepted.</desc><style>.fisn2po-p,.fisn2po-f,.fisn2po-r{transform-box:fill-box;transform-origin:center;animation-fill-mode:both}
.fisn2po-p{animation-name:fisn2po-pop;animation-duration:0.6s;animation-timing-function:cubic-bezier(.34,1.56,.64,1)}
@supports (animation-timing-function:linear(0,1)){.fisn2po-p{animation-timing-function:linear(0, 0.083, 0.269, 0.487, 0.691, 0.855, 0.972, 1.043, 1.078, 1.086, 1.078, 1.061, 1.043, 1.025, 1.011, 1.002, 0.996, 0.993, 0.993, 0.993, 0.995, 0.996, 0.998, 0.999, 1)}}
.fisn2po-f{animation-name:fisn2po-fade;animation-duration:0.5s;animation-timing-function:ease-out}
.fisn2po-r{animation-name:fisn2po-rise;animation-duration:.7s;animation-timing-function:cubic-bezier(0.22,1,0.36,1)}
.fisn2po-d{animation-name:fisn2po-draw;animation-timing-function:cubic-bezier(0.65,0,0.35,1);animation-fill-mode:both}
.fisn2po-m{animation:fisn2po-march 2.6s linear infinite}
.fisn2po-pulse{animation:fisn2po-pulse 2.4s ease-in-out infinite}
@keyframes fisn2po-pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fisn2po-fade{from{opacity:0}to{opacity:1}}
@keyframes fisn2po-rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fisn2po-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fisn2po-march{from{stroke-dashoffset:0}to{stroke-dashoffset:-18}}
@keyframes fisn2po-pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.fisn2po *{animation:none!important}.fisn2po .fisn2po-d{stroke-dashoffset:0}.fisn2po .fisn2po-t{display:none}}</style><defs><mask id="fisn2po-k0" maskUnits="userSpaceOnUse" x="-600" y="-320" width="1800" height="960"><path d="M48 70L552 70" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" class="fisn2po-d" style="animation-duration:0.9s;animation-delay:0.05s"/></mask><mask id="fisn2po-k1" maskUnits="userSpaceOnUse" x="-600" y="-320" width="1800" height="960"><path d="M197.18 220L197.18 256L197.34 258.34L197.81 260.38L198.59 262.09L199.68 263.5L201.09 264.59L202.81 265.38L204.84 265.84L207.18 266L340.4 266L342.74 265.84L344.78 265.38L346.49 264.59L347.9 263.5L348.99 262.09L349.78 260.38L350.24 258.34L350.4 256L350.4 220" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" class="fisn2po-d" style="animation-duration:0.9s;animation-delay:1.11s"/></mask><mask id="fisn2po-k2" maskUnits="userSpaceOnUse" x="-600" y="-320" width="1800" height="960"><path d="M398.78 220L398.78 256L398.94 258.34L399.41 260.38L400.19 262.09L401.28 263.5L402.69 264.59L404.41 265.38L406.44 265.84L408.78 266L519.74 266" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" class="fisn2po-d" style="animation-duration:0.63s;animation-delay:1.43s"/></mask></defs><path d="M48 70L552 70" fill="none" stroke="#8F8E8A" stroke-width="1" stroke-dasharray="4 5" stroke-linejoin="round" mask="url(#fisn2po-k0)" class="fisn2po-m"/>
