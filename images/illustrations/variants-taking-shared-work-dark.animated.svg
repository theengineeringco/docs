<svg xmlns="http://www.w3.org/2000/svg" width="600" height="330" viewBox="0 0 600 330" fill="none" role="img" class="fi1dnjj"><title>A variant taking in shared work</title><desc>The Truck variant runs alongside Base without merging back. It takes in Base's newer changes by updating from its parent, and its own proposals merge into it.</desc><style>.fi1dnjj-p,.fi1dnjj-f,.fi1dnjj-r{transform-box:fill-box;transform-origin:center;animation-fill-mode:both}
.fi1dnjj-p{animation-name:fi1dnjj-pop;animation-duration:0.6s;animation-timing-function:cubic-bezier(.34,1.56,.64,1)}
@supports (animation-timing-function:linear(0,1)){.fi1dnjj-p{animation-timing-function:linear(0, 0.083, 0.269, 0.487, 0.691, 0.855, 0.972, 1.043, 1.078, 1.086, 1.078, 1.061, 1.043, 1.025, 1.011, 1.002, 0.996, 0.993, 0.993, 0.993, 0.995, 0.996, 0.998, 0.999, 1)}}
.fi1dnjj-f{animation-name:fi1dnjj-fade;animation-duration:0.5s;animation-timing-function:ease-out}
.fi1dnjj-r{animation-name:fi1dnjj-rise;animation-duration:.7s;animation-timing-function:cubic-bezier(0.22,1,0.36,1)}
.fi1dnjj-d{animation-name:fi1dnjj-draw;animation-timing-function:cubic-bezier(0.65,0,0.35,1);animation-fill-mode:both}
.fi1dnjj-m{animation:fi1dnjj-march 2.6s linear infinite}
.fi1dnjj-pulse{animation:fi1dnjj-pulse 2.4s ease-in-out infinite}
@keyframes fi1dnjj-pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fi1dnjj-fade{from{opacity:0}to{opacity:1}}
@keyframes fi1dnjj-rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fi1dnjj-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fi1dnjj-march{from{stroke-dashoffset:0}to{stroke-dashoffset:-18}}
@keyframes fi1dnjj-pulse{0%,100%{opacity:1}50%{opacity:.35}}
