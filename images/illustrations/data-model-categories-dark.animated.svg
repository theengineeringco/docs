<svg xmlns="http://www.w3.org/2000/svg" width="640" height="260" viewBox="0 0 640 260" fill="none" role="img" class="fii6gkf"><title>A small data model</title><desc>Five categories and the links between them: an interface connects two systems, a system's requirements are verified by test cases, and each test result belongs to a test case.</desc><style>.fii6gkf-p,.fii6gkf-f,.fii6gkf-r{transform-box:fill-box;transform-origin:center;animation-fill-mode:both}
