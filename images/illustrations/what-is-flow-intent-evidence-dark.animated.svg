<g class="fi89avg-p" style="animation-delay:0.68s"><rect x="475.5" y="65.5" width="9" height="9" fill="#8DACF7"/></g>
<g class="fi89avg-p" style="animation-delay:0.75s"><g class="fi89avg-pulse"><path d="M480 114.24L485.76 120L480 125.76L474.24 120Z" fill="#F8C881" stroke-linejoin="round"/></g></g>
<g class="fi89avg-p" style="animation-delay:0.82s"><circle cx="480" cy="170" r="5" fill="#161513" stroke="#575652" stroke-width="1" stroke-dasharray="3 3"/></g>
<g class="fi89avg-f" style="animation-delay:0.89s"><text x="280" y="48" fill="#7A7975" font-family="'Commit Mono', 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle" letter-spacing="0.24">intent</text></g>
<g class="fi89avg-f" style="animation-delay:0.96s"><text x="480" y="48" fill="#7A7975" font-family="'Commit Mono', 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle" letter-spacing="0.24">evidence</text></g>
<g class="fi89avg-f" style="animation-delay:1.03s"><text x="496" y="74" fill="#7A7975" font-family="'Commit Mono', 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="start" letter-spacing="0.24">met</text></g>
<g class="fi89avg-f" style="animation-delay:1.1s"><text x="496" y="124" fill="#7A7975" font-family="'Commit Mono', 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="start" letter-spacing="0.24">close</text></g>
<g class="fi89avg-f" style="animation-delay:1.17s"><text x="496" y="174" fill="#7A7975" font-family="'Commit Mono', 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="start" letter-spacing="0.24">none yet</text></g></svg>
