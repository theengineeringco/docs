<svg xmlns="http://www.w3.org/2000/svg" width="640" height="250" viewBox="0 0 640 250" fill="none" role="img" class="fi89avg"><title>Intent, evidence, and the gap between them</title><desc>Flow connects each target to the evidence for it: one target is met, one is close but not there, and one has no evidence yet.</desc><style>.fi89avg-p,.fi89avg-f,.fi89avg-r{transform-box:fill-box;transform-origin:center;animation-fill-mode:both}
.fi89avg-p{animation-name:fi89avg-pop;animation-duration:0.6s;animation-timing-function:cubic-bezier(.34,1.56,.64,1)}
@supports (animation-timing-function:linear(0,1)){.fi89avg-p{animation-timing-function:linear(0, 0.083, 0.269, 0.487, 0.691, 0.855, 0.972, 1.043, 1.078, 1.086, 1.078, 1.061, 1.043, 1.025, 1.011, 1.002, 0.996, 0.993, 0.993, 0.993, 0.995, 0.996, 0.998, 0.999, 1)}}
.fi89avg-f{animation-name:fi89avg-fade;animation-duration:0.5s;animation-timing-function:ease-out}
.fi89avg-r{animation-name:fi89avg-rise;animation-duration:.7s;animation-timing-function:cubic-bezier(0.22,1,0.36,1)}
.fi89avg-d{animation-name:fi89avg-draw;animation-timing-function:cubic-bezier(0.65,0,0.35,1);animation-fill-mode:both}
.fi89avg-m{animation:fi89avg-march 2.6s linear infinite}
.fi89avg-pulse{animation:fi89avg-pulse 2.4s ease-in-out infinite}
@keyframes fi89avg-pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fi89avg-fade{from{opacity:0}to{opacity:1}}
@keyframes fi89avg-rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fi89avg-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fi89avg-march{from{stroke-dashoffset:0}to{stroke-dashoffset:-18}}
@keyframes fi89avg-pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.fi89avg *{animation:none!important}.fi89avg .fi89avg-d{stroke-dashoffset:0}.fi89avg .fi89avg-t{display:none}}</style><defs><mask id="fi89avg-k0" maskUnits="userSpaceOnUse" x="-640" y="-250" width="1920" height="750"><path d="M110 120L280 70" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" class="fi89avg-d" style="animation-duration:0.68s;animation-delay:0.05s"/></mask><mask id="fi89avg-k1" maskUnits="userSpaceOnUse" x="-640" y="-250" width="1920" height="750"><path d="M110 120L280 120" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" class="fi89avg-d" style="animation-duration:0.65s;animation-delay:0.12s"/></mask><mask id="fi89avg-k2" maskUnits="userSpaceOnUse" x="-640" y="-250" width="1920" height="750"><path d="M110 120L280 170" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" class="fi89avg-d" style="animation-duration:0.68s;animation-delay:0.19s"/></mask><mask id="fi89avg-k3" maskUnits="userSpaceOnUse" x="-640" y="-250" width="1920" height="750"><path d="M280 70L480 70" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" class="fi89avg-d" style="animation-duration:0.77s;animation-delay:0.26s"/></mask><mask id="fi89avg-k4" maskUnits="userSpaceOnUse" x="-640" y="-250" width="1920" height="750"><path d="M280 120L480 120" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" class="fi89avg-d" style="animation-duration:0.77s;animation-delay:0.33s"/></mask><mask id="fi89avg-k5" maskUnits="userSpaceOnUse" x="-640" y="-250" width="1920" height="750"><path d="M280 170L480 170" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" class="fi89avg-d" style="animation-duration:0.77s;animation-delay:0.4s"/></mask></defs><path d="M110 120L280 70" fill="none" stroke="#575652" stroke-width="1" stroke-dasharray="4 5" stroke-linejoin="round" mask="url(#fi89avg-k0)" class="fi89avg-m"/>
<path d="M110 120L280 120" fill="none" stroke="#575652" stroke-width="1" stroke-dasharray="4 5" stroke-linejoin="round" mask="url(#fi89avg-k1)" class="fi89avg-m"/>
<path d="M110 120L280 170" fill="none" stroke="#575652" stroke-width="1" stroke-dasharray="4 5" stroke-linejoin="round" mask="url(#fi89avg-k2)" class="fi89avg-m"/>
