<svg xmlns="http://www.w3.org/2000/svg" width="600" height="280" viewBox="0 0 600 280" fill="none" role="img" class="fi1cnrs"><title>One value's history across a merge</title><desc>Battery Usable Capacity is raised in two steps on a proposal, then merged. Base records the final value; the intermediate value stays on the branch.</desc><style>.fi1cnrs-p,.fi1cnrs-f,.fi1cnrs-r{transform-box:fill-box;transform-origin:center;animation-fill-mode:both}
.fi1cnrs-p{animation-name:fi1cnrs-pop;animation-duration:0.6s;animation-timing-function:cubic-bezier(.34,1.56,.64,1)}
@supports (animation-timing-function:linear(0,1)){.fi1cnrs-p{animation-timing-function:linear(0, 0.083, 0.269, 0.487, 0.691, 0.855, 0.972, 1.043, 1.078, 1.086, 1.078, 1.061, 1.043, 1.025, 1.011, 1.002, 0.996, 0.993, 0.993, 0.993, 0.995, 0.996, 0.998, 0.999, 1)}}
.fi1cnrs-f{animation-name:fi1cnrs-fade;animation-duration:0.5s;animation-timing-function:ease-out}
.fi1cnrs-r{animation-name:fi1cnrs-rise;animation-duration:.7s;animation-timing-function:cubic-bezier(0.22,1,0.36,1)}
.fi1cnrs-d{animation-name:fi1cnrs-draw;animation-timing-function:cubic-bezier(0.65,0,0.35,1);animation-fill-mode:both}
.fi1cnrs-m{animation:fi1cnrs-march 2.6s linear infinite}
.fi1cnrs-pulse{animation:fi1cnrs-pulse 2.4s ease-in-out infinite}
@keyframes fi1cnrs-pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fi1cnrs-fade{from{opacity:0}to{opacity:1}}
@keyframes fi1cnrs-rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fi1cnrs-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fi1cnrs-march{from{stroke-dashoffset:0}to{stroke-dashoffset:-18}}
@keyframes fi1cnrs-pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.fi1cnrs *{animation:none!important}.fi1cnrs .fi1cnrs-d{stroke-dashoffset:0}.fi1cnrs .fi1cnrs-t{display:none}}</style><defs><mask id="fi1cnrs-k0" maskUnits="userSpaceOnUse" x="-600" y="-280" width="1800" height="840"><path d="M48 170L552 170" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" class="fi1cnrs-d" style="animation-duration:0.9s;animation-delay:0.05s"/></mask><mask id="fi1cnrs-k1" maskUnits="userSpaceOnUse" x="-600" y="-280" width="1800" height="840"><path d="M148.8 170L148.8 110L148.96 107.66L149.43 105.63L150.21 103.91L151.3 102.5L152.71 101.41L154.43 100.63L156.46 100.16L158.8 100L400.88 100L403.22 100.16L405.26 100.63L406.97 101.41L408.38 102.5L409.47 103.91L410.26 105.63L410.72 107.66L410.88 110L410.88 170" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" class="fi1cnrs-d" style="animation-duration:0.9s;animation-delay:0.25s"/></mask></defs><path d="M48 170L552 170" fill="none" stroke="#575652" stroke-width="1" stroke-dasharray="4 5" stroke-linejoin="round" mask="url(#fi1cnrs-k0)" class="fi1cnrs-m"/>
<path d="M148.8 170L148.8 110L148.96 107.66L149.43 105.63L150.21 103.91L151.3 102.5L152.71 101.41L154.43 100.63L156.46 100.16L158.8 100L400.88 100L403.22 100.16L405.26 100.63L406.97 101.41L408.38 102.5L409.47 103.91L410.26 105.63L410.72 107.66L410.88 110L410.88 170" fill="none" stroke="#575652" stroke-width="1" stroke-dasharray="4 5" stroke-linejoin="round" mask="url(#fi1cnrs-k1)" class="fi1cnrs-m"/>
